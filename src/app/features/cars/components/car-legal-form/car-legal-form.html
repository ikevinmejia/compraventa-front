<form [formRoot]="carForm" class="flex gap-3 flex-col w-full pt-2">
  <div class="grid grid-cols-1 gap-4">
    <p class="font-medium text-xl">Lugar de matricula</p>
    <section class="grid sm:grid-cols-2 gap-3">
      <p-floatlabel variant="on">
        <p-select
          inputId="registrationDepartment"
          [formField]="$any(carForm.registrationDepartment)"
          [options]="departments()"
          optionLabel="name"
          filterBy="name"
          [showClear]="true"
          appendTo="body"
          fluid
          filter
        />
        <label for="registrationDepartment">Departamento</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-select
          inputId="registrationCity"
          [formField]="$any(carForm.registrationCity)"
          [options]="municipalities()"
          optionLabel="name"
          filterBy="name"
          [showClear]="true"
          appendTo="body"
          fluid
          filter
        />
        <label for="registrationCity">Municipio</label>
      </p-floatlabel>
    </section>

    <p class="font-medium text-xl">Fecha de expiración de SOAT y Tecnico mecánica</p>
    <section class="grid sm:grid-cols-2 gap-3">
      <p-floatlabel variant="on">
        <p-datepicker
          inputId="soatExpirationDate"
          [formField]="$any(carForm.soatExpirationDate)"
          [showIcon]="true"
          [showClear]="true"
          appendTo="body"
          [minDate]="minDate"
          fluid
        />
        <label for="soatExpirationDate">SOAT</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-datepicker
          inputId="technicalInspectionExpirationDate"
          [formField]="$any(carForm.technicalInspectionExpirationDate)"
          [showIcon]="true"
          [showClear]="true"
          appendTo="body"
          [minDate]="minDate"
          fluid
        />
        <label for="technicalInspectionExpirationDate">Tecnico mecánica</label>
      </p-floatlabel>
    </section>

    <p class="font-medium text-xl">Fotomultas</p>

    <div class="flex flex-col gap-3 md:max-w-fit">
      <label for="hasTrafficFines">¿Tiene fotomultas?</label>
      <p-selectbutton
        inputId="hasTrafficFines"
        [formField]="$any(carForm.hasTrafficFines)"
        [options]="yesNoOptions()"
        optionLabel="name"
        filterBy="name"
        appendTo="body"
        fluid
      />
    </div>
    <section class="grid md:grid-cols-2 gap-3">
      <p-floatlabel variant="on">
        <input
          pInputText
          id="trafficFinesCount"
          type="number"
          inputmode="numeric"
          autocomplete="off"
          [formField]="carForm.trafficFinesCount"
          class="w-full"
        />
        <label for="trafficFinesCount">Cantidad de multas</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="trafficFinesTotalAmount"
          type="number"
          inputmode="numeric"
          autocomplete="off"
          [formField]="carForm.trafficFinesTotalAmount"
          class="w-full"
        />
        <label for="trafficFinesTotalAmount">Total dinero en multas</label>
      </p-floatlabel>
    </section>

    <p class="font-medium text-xl">Impuestos</p>
    <section class="grid md:flex gap-6 md:gap-2">
      <div class="flex flex-col gap-3 w-full">
        <label for="municipalTrafficLightTaxUpToDate"
          >¿Esta al día impuesto municipal - semaforización?</label
        >
        <p-selectbutton
          inputId="municipalTrafficLightTaxUpToDate"
          [formField]="$any(carForm.municipalTrafficLightTaxUpToDate)"
          [options]="yesNoOptions()"
          optionLabel="name"
          filterBy="name"
          appendTo="body"
          fluid
        />
      </div>
      <p-divider layout="vertical" class="hidden md:block" />
      <div class="flex flex-col gap-3 w-full">
        <label for="taxesUpToDate">¿Impuestos al día?</label>
        <p-selectbutton
          inputId="taxesUpToDate"
          [formField]="$any(carForm.taxesUpToDate)"
          [options]="yesNoOptions()"
          optionLabel="name"
          filterBy="name"
          appendTo="body"
          fluid
        />
      </div>
    </section>
    <p-floatlabel variant="on">
      <p-select
        inputId="taxesOwedYears"
        [formField]="$any(carForm.taxesOwedYears)"
        [options]="aniosEnDeuda()"
        optionLabel="name"
        filterBy="name"
        [showClear]="true"
        appendTo="body"
        fluid
      />
      <label for="taxesOwedYears">Años de deuda en impuestos</label>
    </p-floatlabel>

    <p class="font-medium text-xl">Licencia</p>

    <div class="flex flex-col gap-3 md:max-w-fit">
      <label for="taxesUpToDate">¿Coincide con el runt?</label>
      <p-selectbutton
        inputId="runtMatchesLicense"
        [formField]="$any(carForm.runtMatchesLicense)"
        [options]="yesNoOptions()"
        optionLabel="name"
        filterBy="name"
        appendTo="body"
        fluid
      />
    </div>

    <p class="font-medium text-xl">Gravamenes</p>

    <div class="flex flex-col gap-3 md:max-w-fit">
      <label for="taxesUpToDate">¿Tiene gravamenes?</label>
      <p-selectbutton
        inputId="runtHasLiens"
        [formField]="$any(carForm.runtHasLiens)"
        [options]="yesNoOptions()"
        optionLabel="name"
        filterBy="name"
        appendTo="body"
        fluid
      />
    </div>

    <p-floatlabel variant="on">
      <p-multiselect
        inputId="runtPendingIssues"
        [formField]="$any(carForm.runtPendingIssues)"
        [options]="runtPendingIssues()"
        optionLabel="name"
        filterBy="name"
        [showClear]="true"
        appendTo="body"
        fluid
      />
      <label for="runtPendingIssues">Tipo de gravamen</label>
    </p-floatlabel>

    <p class="font-medium text-xl">Siniestros</p>

    <div class="flex flex-col gap-3 md:max-w-fit">
      <label for="taxesUpToDate">¿Tiene siniestros?</label>
      <p-selectbutton
        inputId="hasInsuranceClaims"
        [formField]="$any(carForm.hasInsuranceClaims)"
        [options]="yesNoOptions()"
        optionLabel="name"
        filterBy="name"
        appendTo="body"
        fluid
      />
    </div>

    <p-floatlabel variant="on">
      <p-select
        inputId="insuranceClaimType"
        [formField]="$any(carForm.insuranceClaimType)"
        [options]="insuranceClaimType()"
        optionLabel="name"
        filterBy="name"
        [showClear]="true"
        appendTo="body"
        fluid
      />
      <label for="insuranceClaimType">Tipo de siniestro</label>
    </p-floatlabel>

    <p class="font-medium text-xl">Uso público</p>

    <div class="flex flex-col gap-3 md:max-w-fit">
      <label for="taxesUpToDate">¿Tuvo uso público?</label>
      <p-selectbutton
        inputId="hadPublicServiceUse"
        [formField]="$any(carForm.hadPublicServiceUse)"
        [options]="yesNoOptions()"
        optionLabel="name"
        filterBy="name"
        appendTo="body"
        fluid
      />
    </div>
  </div>

  <div class="flex flex-col items-center gap-4 mt-1">
    <p-button class="w-full" fluid type="submit" [disabled]="carForm().submitting()">
      @if (carForm().submitting()) {
        Guardando...
      } @else {
        Guardar cambios
      }
    </p-button>
  </div>
</form>
