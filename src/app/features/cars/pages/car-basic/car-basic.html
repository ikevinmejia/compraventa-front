<form [formRoot]="carForm" class="flex flex-col gap-3 w-full">
  <app-car-form-fields [form]="carForm" [model]="model"> </app-car-form-fields>

  <div class="flex flex-col items-center gap-4 mt-1">
    <p-button class="w-full" [fluid]="true" type="submit" [disabled]="carForm().submitting()">
      @if (carForm().submitting()) {
        Guardando...
      } @else {
        Guardar cambios
      }
    </p-button>
  </div>
</form>
