<div class="grid grid-cols-12 gap-8">
  <app-stats-widget class="contents" />
  <app-bar-chart
    header="Ventas por semana"
    [data]="graficoVentasSemana()"
    [options]="{ plugins: { legend: { display: false } } }"
    class="col-span-12 xl:col-span-6"
  />
  <app-bar-chart
    header="Ingresos por mes"
    [data]="graficoIngresosMes()"
    [options]="{ plugins: { legend: { display: false } } }"
    class="col-span-12 xl:col-span-6"
  />
  <app-bar-chart
    header="Marcas maás vendidas"
    [data]="graficoMarcaMasVendidas()"
    [options]="{ plugins: { legend: { display: false } } }"
    class="col-span-12 xl:col-span-6"
  />
  <app-bar-chart
    header="Tiempo promedio en inventario"
    [data]="graficoAntiguedad()"
    [options]="{ plugins: { legend: { display: false } } }"
    class="col-span-12 xl:col-span-6"
  />
  <app-data-table
    title="Inventario estancado"
    class="col-span-12 xl:col-span-6"
    [columns]="dataTableInventory().columns"
    [rows]="dataTableInventory().rows"
  >
    <ng-template appCell="imagen" let-row>
      <img [src]="row.imagen" [alt]="row.nombre" width="48" />
    </ng-template>

    <ng-template appCell="estado" let-row>
      <p-tag [value]="row.estado" [severity]="row.estado === 'Disponible' ? 'success' : 'warn'" />
    </ng-template>
  </app-data-table>
  <app-data-table
    title="Pendientes de documentación"
    class="col-span-12 xl:col-span-6"
    [columns]="dataTableDocu().columns"
    [rows]="dataTableDocu().rows"
  />
  <app-data-table
    title="Alertas legales"
    class="col-span-12 xl:col-span-6"
    [columns]="dataTableLegal().columns"
    [rows]="dataTableLegal().rows"
  />
</div>
