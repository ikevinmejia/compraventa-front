@for (kpi of kpis; track kpi.key) {
  <p-card class="col-span-12 sm:col-span-6 xl:col-span-2">
    <div class="flex justify-between">
      <div>
        <span class="block text-muted-color font-medium mb-4">{{ kpi.label }}</span>
        <div class="text-surface-900 dark:text-surface-0 font-medium text-xl">
          {{ kpi.value }}
          @if (kpi.trend) {
            <span
              class="text-sm font-medium"
              [class]="kpi.trend.direction === 'up' ? 'text-green-500' : 'text-red-500'"
            >
              <i
                class="pi"
                [class]="kpi.trend.direction === 'up' ? 'pi-arrow-up' : 'pi-arrow-down'"
              ></i>
              {{ kpi.trend.percentage }}%
            </span>
          }
        </div>
      </div>
      <div
        class="flex items-center justify-center rounded-border"
        [class]="colorClasses[kpi.color].bg"
        style="width: 2.5rem; height: 2.5rem"
      >
        <i class="pi text-xl!" [class]="[kpi.icon, colorClasses[kpi.color].text]"></i>
      </div>
    </div>
  </p-card>
}
