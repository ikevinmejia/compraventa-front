<section class="flex flex-col gap-4 items-center overflow-hidden">
  @if (title()) {
    <p class="text-2xl font-medium">{{ title() }}</p>
  }
  @if (subtitle()) {
    <p class="text-lg font-light">{{ subtitle() }}</p>
  }

  <picture class="mt-2">
    <img
      src="assets/empty.svg"
      alt="No hay valores para mostrar"
      class="w-48 sm:w-lg h-auto object-contain"
    />
  </picture>
</section>
