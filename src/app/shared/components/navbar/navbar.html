<div class="card flex justify-center">
  <p-drawer
    #drawerRef
    [visible]="layoutService.layoutState().overlayMenuActive"
    (visibleChange)="layoutService.setOverlayMenuActive($event)"
  >
    <ng-template #headless>
      <div class="flex flex-col h-full">
        <div class="flex items-center justify-between px-6 pt-4 shrink-0">
          <span class="inline-flex items-center gap-2">
            <app-logo />
          </span>
          <span>
            <p-button
              type="button"
              (click)="drawerRef.close($event)"
              icon="pi pi-times"
              rounded="true"
              outlined="true"
              styleClass="h-8 w-8"
            ></p-button>
          </span>
        </div>
        <div class="overflow-y-auto">
          <app-menu-layout />
        </div>
        <div class="mt-auto">
          <hr class="mb-2 mx-4 border-t border-0 border-surface" />
          <div class="flex items-center justify-between pr-2">
            <a
              pRipple
              class="m-4 flex items-center cursor-pointer p-4 gap-2 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple"
            >
              <p-avatar
                image="https://optimus.openng.org/demo/avatar/amyelsner.png"
                shape="circle"
              />
              <span class="font-bold">Amy Elsner</span>
            </a>
            <p-button
              type="button"
              icon="pi pi-sign-out"
              aria-label="logout"
              variant="text"
              severity="contrast"
              (click)="logout($event)"
            />
          </div>
        </div>
      </div>
    </ng-template>
  </p-drawer>
</div>
