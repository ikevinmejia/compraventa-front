<form class="flex flex-wrap items-end gap-4" (ngSubmit)="apply()">
  @for (field of fields(); track field.key) {
    <div class="flex flex-col gap-1">
      <label [for]="field.key" class="text-sm">{{ field.label }}</label>

      @switch (field.type) {
        @case ('text') {
          <input
            pInputText
            [id]="field.key"
            [name]="field.key"
            [placeholder]="field.placeholder ?? ''"
            autocomplete="off"
            [ngModel]="draft()[field.key]"
            (ngModelChange)="
              field.live ? onSearchInput(field.key, $event) : setDraft(field.key, $event)
            "
          />
        }

        @case ('select') {
          <app-filter-select
            [field]="field"
            [value]="draft()[field.key]"
            [parentValue]="field.dependsOn ? draft()[field.dependsOn] : undefined"
            (valueChange)="setDraft(field.key, $event)"
          />
        }

        @case ('date-range') {
          <p-datepicker
            [inputId]="field.key"
            [name]="field.key"
            selectionMode="range"
            [showClear]="true"
            dateFormat="dd/mm/yy"
            [ngModel]="draft()[field.key]"
            (ngModelChange)="setDraft(field.key, $event)"
          />
        }
      }
    </div>
  }

  <p-button type="submit" label="Aplicar" icon="pi pi-filter" />
  <p-button type="button" label="Limpiar" severity="secondary" outlined (onClick)="clear()" />
</form>
